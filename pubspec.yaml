name: scopo
description: "Asynchronous resources owned by the widget tree: cancellable
  initialization with loading and error branches, ordered and awaited
  disposal, one owner at a time."
version: 0.21.2
homepage: https://github.com/vi-k/scopo
repository: https://github.com/vi-k/scopo
issue_tracker: https://github.com/vi-k/scopo/issues
topics:
  - lifecycle
  - async
  - dependency-injection
  - scope
  - widgets

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  async_job: ^0.6.0
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  test: ^1.24.0
