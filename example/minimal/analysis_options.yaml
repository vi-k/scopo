# The package's own strict config, one level up: an example is code the reader
# copies, so it answers to the same rules as `lib/`.
include: ../../analysis_options.yaml

linter:
  rules:
    # Off for an example, the same two `example/scopo_demo` switches off: an
    # example app exports no API to document, and its one-line widget methods
    # read better as blocks. `discarded_futures` needs no line here: the root
    # config switches it off for the whole package.
    public_member_api_docs: false
    prefer_expression_function_bodies: false
